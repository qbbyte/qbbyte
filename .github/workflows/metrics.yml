name: Metrics‑Radar
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          username: qbbyte
          output: metrics.svg

          plugins_activity: yes
          plugins_activity_radar: yes
          plugins_activity_limit: 100

          plugins_base: no
          plugins_languages: no
          plugins_repositories: no
          plugins_achievements: no
