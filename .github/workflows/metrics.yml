name: Metrics‑Radar
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          username: qbbyte
          output: metrics.svg

          # 只开启活动雷达图，其他插件全部关闭
          plugins_activity: yes
          plugins_activity_radar: yes

          plugins_base: no
          plugins_languages: no
          plugins_repositories: no
          plugins_achievements: no
