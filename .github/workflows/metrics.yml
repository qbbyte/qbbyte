name: Metrics‑Radar
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          username: qbbyte
          output: metrics.svg
          # 只渲染activity_radar部件！关键配置
          plugins: activity_radar
          plugins_activity_limit: 100
